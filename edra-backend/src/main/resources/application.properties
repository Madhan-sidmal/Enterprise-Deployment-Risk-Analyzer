spring.application.name=edra-backend

# PostgreSQL Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/edra_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# JWT Configuration
edra.jwt.secret=${JWT_SECRET:EDRASecretKey2024!@#$%^&*()DevSecOpsIntelligencePlatformSecureKey}
edra.jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# Server
server.port=8080

# Actuator - expose health endpoint for Docker health checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# CORS - allow React frontend
spring.web.cors.allowed-origins=http://localhost:5173
