# ── Test Profile: uses H2 in-memory DB ────────────────────
# No real PostgreSQL needed for unit/integration tests

spring.datasource.url=jdbc:h2:mem:edra_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;NON_KEYWORDS=VALUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# JWT for tests
edra.jwt.secret=TestJwtSecretKeyForCIPipelineOnlyNotForProduction12345
edra.jwt.expiration=3600000

# Disable actuator verbose output in tests
management.endpoints.web.exposure.include=health
